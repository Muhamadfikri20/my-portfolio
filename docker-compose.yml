services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
        - VITE_ADMIN_EMAIL=${VITE_ADMIN_EMAIL:-admin@example.com}
        - VITE_RAPIDAPI_KEY=${VITE_RAPIDAPI_KEY:-}
    container_name: rheyno-portfolio
    ports:
      - "3002:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - portfolio-network
      - lb-network

networks:
  portfolio-network:
    driver: bridge
  lb-network:
    external: true
